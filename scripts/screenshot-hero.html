<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Stuffy</title>
<link rel="stylesheet" href="../renderer/hamster/stuffy.css">
<style>
  body { margin: 0; background: linear-gradient(135deg, #2b3550, #5b4470 55%, #a8705f); font-family: "Segoe UI", sans-serif; }
  .wrap { width: 960px; height: 460px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .stuffy { width: 840px; height: 392px; }
  .stuffy svg { width: 100%; height: 100%; }
</style>
</head>
<body>
  <div class="wrap"><div class="stuffy" id="stuffy"></div></div>
<script src="../renderer/hamster/habitat.js"></script>
<script src="../renderer/hamster/stuffy.js"></script>
<script>
  const box = document.getElementById('stuffy');
  box.innerHTML = window.HABITAT_SVG;
  const s = new window.Stuffy(box.querySelector('svg'));
  clearTimeout(s.idleTimer);
  s.atHome = false;
  s.place(150, 52, 1);
  s.setClasses(['happy']);
  document.getAnimations().forEach((a) => { a.pause(); a.currentTime = 400; });
</script>
</body>
</html>
